<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Knowledge Graph</title>
    <!-- 引入高档 Inter 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #151b23; /* 默认暗夜背景 */
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
            color: #f3f4f6;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        /* 白天模式 */
        body.light {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.06) 0px, transparent 50%);
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            height: 90vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            background: rgba(22, 27, 34, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 30px;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body.light .container {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(15, 23, 42, 0.08);
            box-shadow: 
                0 30px 60px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .container:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }
        
        body.light .container:hover {
            border-color: rgba(15, 23, 42, 0.12);
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: -0.75px;
            background: linear-gradient(135deg, #818cf8, #c084fc, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex-shrink: 0;
            transition: all 0.4s ease;
        }
        
        body.light h1 {
            background: linear-gradient(135deg, #4f46e5, #7c3aed, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chart-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            position: relative;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 10px;
            box-sizing: border-box;
            transition: all 0.4s ease;
        }
        
        body.light .chart-wrapper {
            background: rgba(15, 23, 42, 0.03);
            border-color: rgba(15, 23, 42, 0.03);
        }

        .tip-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 16px;
            border-radius: 9999px;
            margin-top: 20px;
            font-size: 13px;
            color: #9ca3af;
            font-weight: 500;
            flex-shrink: 0;
            align-self: center;
            transition: all 0.4s ease;
        }
        
        body.light .tip-badge {
            background: rgba(15, 23, 42, 0.04);
            border-color: rgba(15, 23, 42, 0.06);
            color: #475569;
        }

        .tip-badge svg {
            width: 16px;
            height: 16px;
            color: #818cf8;
            transition: color 0.4s ease;
        }
        
        body.light .tip-badge svg {
            color: #4f46e5;
        }

        /* 主题切换圆钮 */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        
        body.light .theme-toggle {
            background: rgba(15, 23, 42, 0.04);
            border-color: rgba(15, 23, 42, 0.08);
            color: #0f172a;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        body.light .theme-toggle:hover {
            background: rgba(15, 23, 42, 0.08);
            border-color: rgba(15, 23, 42, 0.12);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* 控制太阳/月亮图标展示 */
        body.light .sun-icon {
            display: block;
        }
        body.light .moon-icon {
            display: none;
        }
        body:not(.light) .sun-icon {
            display: none;
        }
        body:not(.light) .moon-icon {
            display: block;
        }
    </style>
</head>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const chartDiv = document.querySelector('.plotly-graph-div');
        
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            
            // 如果页面存在 Plotly，动态切换图表文本颜色以保障清晰度
            if (chartDiv && window.Plotly) {
                const newFontColor = isLight ? '#0f172a' : '#f3f4f6';
                Plotly.relayout(chartDiv.id, {
                    'font.color': newFontColor
                });
            }
        });
    </script>
